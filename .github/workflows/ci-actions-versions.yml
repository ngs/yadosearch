name: Check Actions Versions

on:
  push:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/**"
  schedule:
    # Weekly, Monday 10:00 JST (01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  check-versions:
    name: Check outdated actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # With skip_pull_request the action reports rather than opens a PR: it
      # writes the diff to the job summary and exits 1 when something is behind.
      # Dependabot (.github/dependabot.yml) raises the updates; this job is what
      # notices when they have not been merged.
      - name: Check for outdated actions
        uses: saadmk11/github-actions-version-updater@v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip_pull_request: "true"

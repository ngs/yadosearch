name: Release Build and Upload

on:
  # Trigger when CI completes successfully on the default branches.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options: [all, ios, mac]
        default: all
      skip_upload:
        description: "Skip the App Store upload"
        required: false
        type: boolean
        default: false

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
  APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
  PRECHECK_INCLUDE_IN_APP_PURCHASES: "false"
  # Must be the SSH URL (git@github.com:…): the runner authenticates with the
  # deploy key, and HTTPS would prompt for a username.
  MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  MATCH_KEYCHAIN_NAME: tmp.keychain
  CERT_KEYCHAIN_NAME: tmp.keychain
  KEYCHAIN_NAME: tmp.keychain
  MATCH_KEYCHAIN_PASSWORD: tmp
  CERT_KEYCHAIN_PASSWORD: tmp
  KEYCHAIN_PASSWORD: tmp
  MATCH_READONLY: "true"
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "600"
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
  # A release build without the key would ship an app that cannot search.
  TUIST_JALAN_API_KEY: ${{ secrets.JALAN_API_KEY }}

jobs:
  determine-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      skip_upload: ${{ steps.set-params.outputs.skip_upload }}
      should_deploy: ${{ steps.set-params.outputs.should_deploy }}
    steps:
      - name: Set parameters
        id: set-params
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip_upload=${{ github.event.inputs.skip_upload }}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "skip_upload=false" >> $GITHUB_OUTPUT
            if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "CI concluded '${{ github.event.workflow_run.conclusion }}'; not releasing"
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.platform }}" != "all" ]]; then
            echo 'matrix=["${{ github.event.inputs.platform }}"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["ios", "mac"]' >> $GITHUB_OUTPUT
          fi

  release:
    needs: determine-platforms
    if: needs.determine-platforms.outputs.should_deploy == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.determine-platforms.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Error: Xcode 26.x not found"; ls -la /Applications | grep Xcode; exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.316.0
        with:
          bundler-cache: true

      - name: Create CI keychain
        run: bundle exec fastlane create_ci_keychain

      - name: Setup SSH for match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Cache match certificates
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/MobileDevice/Provisioning Profiles
          key: ${{ runner.os }}-certificates-${{ matrix.platform }}-${{ hashFiles('**/Matchfile') }}
          restore-keys: |
            ${{ runner.os }}-certificates-${{ matrix.platform }}-
            ${{ runner.os }}-certificates-

      - name: Install tuist (mise)
        uses: jdx/mise-action@v4.2.0

      - name: Generate Xcode project and workspace
        run: |
          case "${{ matrix.platform }}" in
            ios) export TUIST_BUILD_NUMBER="${{ github.run_id }}.1" ;;
            mac) export TUIST_BUILD_NUMBER="${{ github.run_id }}.2" ;;
          esac
          echo "Using build number: $TUIST_BUILD_NUMBER"
          tuist generate --no-open

      - name: Build release
        run: bundle exec fastlane ${{ matrix.platform }} release_build

      - name: Upload to App Store Connect
        if: needs.determine-platforms.outputs.skip_upload != 'true'
        run: bundle exec fastlane ${{ matrix.platform }} release_upload

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/release/**/*.ipa
            build/release/**/*.pkg
            build/release/**/*.dSYM.zip
            fastlane/report.xml
          retention-days: 30

      - name: Upload gym logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gym-logs-${{ matrix.platform }}-${{ github.sha }}
          path: |
            /Users/runner/Library/Logs/gym/*.log
            fastlane/report.xml
          retention-days: 7

  create-release:
    needs: [release, determine-platforms]
    if: |
      needs.release.result == 'success' &&
      needs.determine-platforms.outputs.skip_upload != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep -E 'version *= *"' Project.swift | head -1 | sed -E 's/.*version *= *"([^"]+)".*/\1/' || echo "1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: release-*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_id }}
          name: Release v${{ steps.version.outputs.version }} (Build ${{ github.run_id }})
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/**/*.ipa
            artifacts/**/*.pkg
            artifacts/**/*.dSYM.zip

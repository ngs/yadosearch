disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - test_case_accessibility
  - toggle_bool
  - trailing_whitespace
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

excluded:
  - .build
  - DerivedData
  - Derived
  - .swiftpm
  - Package.swift

analyzer_rules:
  - unused_declaration
  - unused_import

# SwiftUI's own idiom puts a property wrapper on the same line as the property
# it wraps, even when it takes arguments; `@ViewBuilder` on a member reads
# better above it.
attributes:
  always_on_same_line:
    - "@IBAction"
    - "@NSManaged"
    - "@Environment"
    - "@Query"
    - "@Attribute"
    - "@State"
  always_on_line_above:
    - "@ViewBuilder"

type_name:
  min_length: 3
  max_length: 45
  excluded:
    # `Identifiable`'s associated type is spelled this way by the language.
    - ID

identifier_name:
  min_length: 2
  max_length: 45
  excluded:
    - id
    - cd
    - x
    - y
    - to

nesting:
  type_level: 2

custom_rules:
  no_print:
    name: "Avoid print()"
    regex: '\bprint\('
    message: "Use proper logging instead of print()"
    severity: warning
    excluded:
      - ".*/Scripts/.*\\.swift"
